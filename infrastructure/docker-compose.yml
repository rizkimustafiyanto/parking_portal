version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1
      POSTGRES_DB: parking_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parking_portal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portal-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: portal-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portal-network

  backend:
    container_name: portal-backend
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - ../backend/.env.docker
    ports:
      - "8100:8100"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - portal-network

  frontend:
    container_name: portal-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8100
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8100
    ports:
      - "3000:3000"
    networks:
      - portal-network

volumes:
  postgres_data:
  rabbitmq_data:
  uploads_data:

networks:
  portal-network:
    driver: bridge